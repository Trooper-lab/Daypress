[package]
name = "daypress-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "daypress_server"
path = "src/lib.rs"

[[bin]]
name = "daypress"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
rusqlite = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
clap = { workspace = true }
regex = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
quick-xml = { workspace = true }
image = { workspace = true }
argon2 = { workspace = true }
getrandom = { workspace = true }
lettre = { workspace = true }
sha2 = { workspace = true }
ring = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
flate2 = { workspace = true }
semver = { workspace = true }
ab_glyph = "0.2.32"
daypress-ast = { path = "../daypress-ast" }
daypress-wasm = { path = "../daypress-wasm" }
generated_slugify = { path = "../generated_slugify" }

[dev-dependencies]
tower = { workspace = true }

[package.metadata.deb]
name = "daypress"
maintainer = "Daypress Contributors <hello@daypress.dev>"
copyright = "2026, Daypress Contributors"
license-file = ["../../LICENSE", "0"]
extended-description = "Daypress is a drop-in WordPress CMS replacement written in native Rust (Axum + Rusqlite) with 1-Click WP Migration, Daystudio Visual Builder, and built-in MCP Server."
depends = "$auto, ca-certificates"
section = "web"
priority = "optional"
assets = [
    ["target/release/daypress", "usr/bin/daypress", "755"],
    ["../../packaging/systemd/daypress.service", "lib/systemd/system/daypress.service", "644"],
    ["../../README.md", "usr/share/doc/daypress/README.md", "644"],
]
systemd-units = { unit-name = "daypress", enable = true, start = false }

[package.metadata.generate-rpm]
name = "daypress"
summary = "Daypress — Self-Hosted Rust CMS with 1-Click WP Migration & Built-in MCP Server"
license = "AGPL-3.0-or-later"
assets = [
    { source = "target/release/daypress", dest = "/usr/bin/daypress", mode = "755" },
    { source = "../../packaging/systemd/daypress.service", dest = "/usr/lib/systemd/system/daypress.service", mode = "644" },
    { source = "../../README.md", dest = "/usr/share/doc/daypress/README.md", mode = "644", doc = true },
]

