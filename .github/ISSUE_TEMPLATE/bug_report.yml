name: Bug report
description: Something in Daypress does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! For security problems, follow [SECURITY.md](https://github.com/Trooper-lab/daypress/blob/main/SECURITY.md) instead.
        If a migrated WordPress site looks or behaves wrong, use the **Migration report** template.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem. Include error messages if there are any.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to /d-admin/...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Daypress version or commit
      placeholder: "v0.1.0, or a commit hash"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where are you running Daypress?
      options:
        - Linux
        - Windows
        - macOS
        - Docker
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Server output around the time of the problem. Remove passwords, tokens, and personal data first.
      render: shell
