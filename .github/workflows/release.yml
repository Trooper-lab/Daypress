name: Release

# Builds `daypress` in release mode for each platform and attaches the archives, plus a
# SHA256SUMS file, to the GitHub Release for the tag, and publishes multi-arch Docker images
# to GitHub Container Registry (ghcr.io). Runs when a `v*` tag is pushed, or by hand for a
# tag that already exists (Actions → Release → Run workflow).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.3.0"
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 links against glibc 2.35, so the binary also runs on older distributions.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          # Cross-compiled on the Apple Silicon runner.
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Check the tag name
        shell: bash
        run: |
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z.+-]+$ ]]; then
            echo "Not a release tag: $TAG" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked -p daypress-server --bin daypress --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: target/${{ matrix.target }}/release/daypress --help

      - name: Package (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="daypress-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/daypress" "dist/$name/"
          cp README.md LICENSE LICENSE-COMMERCIAL.md NOTICE "dist/$name/"
          cp packaging/systemd/daypress.service "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"

      - name: Package Linux .deb and .rpm (systemd unit included)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          VER="${TAG#v}"
          DEB_DIR="dist/deb_root"
          mkdir -p "$DEB_DIR/DEBIAN" "$DEB_DIR/usr/bin" "$DEB_DIR/lib/systemd/system" "$DEB_DIR/usr/share/doc/daypress"
          cp "target/${{ matrix.target }}/release/daypress" "$DEB_DIR/usr/bin/daypress"
          chmod 0755 "$DEB_DIR/usr/bin/daypress"
          cp packaging/systemd/daypress.service "$DEB_DIR/lib/systemd/system/daypress.service"
          chmod 0644 "$DEB_DIR/lib/systemd/system/daypress.service"
          cp README.md LICENSE "$DEB_DIR/usr/share/doc/daypress/"
          cat > "$DEB_DIR/DEBIAN/control" <<EOF
          Package: daypress
          Version: ${VER}
          Section: web
          Priority: optional
          Architecture: amd64
          Depends: libc6, ca-certificates
          Maintainer: Daypress Contributors <hello@daypress.dev>
          Homepage: https://daypress.dev
          Description: Self-Hosted Rust CMS with 1-Click WP Migration & Built-in MCP Server
          EOF
          cat > "$DEB_DIR/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if ! id -u daypress >/dev/null 2>&1; then
            useradd --system --user-group --home-dir /var/lib/daypress --create-home --shell /usr/sbin/nologin daypress || true
          fi
          mkdir -p /var/lib/daypress
          chown -R daypress:daypress /var/lib/daypress || true
          if command -v systemctl >/dev/null 2>&1; then
            systemctl daemon-reload || true
          fi
          EOF
          chmod 0755 "$DEB_DIR/DEBIAN/postinst"
          dpkg-deb --build --root-owner-group "$DEB_DIR" "dist/daypress_${VER}_amd64.deb"
          rm -rf "$DEB_DIR"

          sudo apt-get update && sudo apt-get install -y rpm
          RPM_TOP="$(pwd)/dist/rpmbuild"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          RPM_VER="${VER//-/_}"
          cat > "$RPM_TOP/SPECS/daypress.spec" <<EOF
          Name:           daypress
          Version:        ${RPM_VER}
          Release:        1%{?dist}
          Summary:        Daypress — Self-Hosted Rust CMS with 1-Click WP Migration & Built-in MCP Server
          License:        AGPL-3.0-or-later
          URL:            https://daypress.dev
          BuildArch:      x86_64
          %description
          Daypress is a drop-in WordPress CMS replacement written in native Rust (Axum + Rusqlite).
          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/lib/systemd/system
          install -m 0755 "$(pwd)/target/${{ matrix.target }}/release/daypress" %{buildroot}/usr/bin/daypress
          install -m 0644 "$(pwd)/packaging/systemd/daypress.service" %{buildroot}/usr/lib/systemd/system/daypress.service
          %files
          /usr/bin/daypress
          /usr/lib/systemd/system/daypress.service
          %post
          id -u daypress >/dev/null 2>&1 || useradd --system --user-group --home-dir /var/lib/daypress --create-home --shell /sbin/nologin daypress || true
          mkdir -p /var/lib/daypress && chown -R daypress:daypress /var/lib/daypress || true
          EOF
          rpmbuild --define "_topdir $RPM_TOP" -bb "$RPM_TOP/SPECS/daypress.spec"
          find "$RPM_TOP/RPMS" -name "*.rpm" -exec cp {} "dist/daypress-${VER}-1.x86_64.rpm" \;
          rm -rf "$RPM_TOP"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "daypress-$env:TAG-${{ matrix.target }}"
          New-Item -ItemType Directory -Force "dist/$name" | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/daypress.exe" "dist/$name/"
          Copy-Item README.md, LICENSE, LICENSE-COMMERCIAL.md, NOTICE "dist/$name/"
          Compress-Archive -Path "dist/$name" -DestinationPath "dist/$name.zip"

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daypress-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  release:
    name: Publish release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: daypress-*
          path: dist
          merge-multiple: true

      - name: Generate Homebrew formula and checksums
        shell: bash
        run: |
          VER="${TAG#v}"
          SHA_DARWIN_ARM64=$(sha256sum "dist/daypress-${TAG}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_DARWIN_AMD64=$(sha256sum "dist/daypress-${TAG}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          SHA_LINUX_AMD64=$(sha256sum "dist/daypress-${TAG}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          sed \
            -e "s/{{VERSION}}/${VER}/g" \
            -e "s/{{SHA256_DARWIN_ARM64}}/${SHA_DARWIN_ARM64}/g" \
            -e "s/{{SHA256_DARWIN_AMD64}}/${SHA_DARWIN_AMD64}/g" \
            -e "s/{{SHA256_LINUX_AMD64}}/${SHA_LINUX_AMD64}/g" \
            packaging/homebrew/daypress.rb > dist/daypress.rb
          cd dist
          sha256sum daypress* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release or add the assets to it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            prerelease=""
            case "$TAG" in *-*) prerelease="--prerelease" ;; esac
            gh release create "$TAG" dist/* --verify-tag --title "Daypress $TAG" --generate-notes $prerelease
          fi

  docker:
    name: Publish GHCR Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          IMAGE_LC=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          VER="${TAG#v}"
          TAGS="${IMAGE_LC}:${TAG},${IMAGE_LC}:${VER}"
          if [[ "$TAG" != *-* ]]; then
            TAGS="${TAGS},${IMAGE_LC}:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
