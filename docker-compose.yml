# Runs Daypress with its database, uploads and backups in a named volume.
#
#   docker compose up -d             # pulls ghcr.io/trooper-lab/daypress:latest
#   docker compose up -d --build     # or build locally from Dockerfile
#   docker compose logs daypress     # shows the generated admin password on first start
#
# Values in ${...} come from your shell or from a .env file next to this file.

name: daypress

services:
  daypress:
    image: ghcr.io/trooper-lab/daypress:latest
    build: .
    ports:
      - "8090:8090"
    environment:
      PORT: "8090"
      DATABASE_PATH: /data/daypress.sqlite
      # Optional: choose the first admin password instead of a generated one.
      DAYPRESS_ADMIN_PASSWORD: ${DAYPRESS_ADMIN_PASSWORD:-}
      # Optional: SMTP for form notifications and email. Nothing is sent without a host.
      DAYPRESS_SMTP_HOST: ${DAYPRESS_SMTP_HOST:-}
      DAYPRESS_SMTP_PORT: ${DAYPRESS_SMTP_PORT:-}
      DAYPRESS_SMTP_SECURITY: ${DAYPRESS_SMTP_SECURITY:-}
      DAYPRESS_SMTP_USER: ${DAYPRESS_SMTP_USER:-}
      DAYPRESS_SMTP_PASSWORD: ${DAYPRESS_SMTP_PASSWORD:-}
      DAYPRESS_SMTP_FROM: ${DAYPRESS_SMTP_FROM:-}
      DAYPRESS_SMTP_FROM_NAME: ${DAYPRESS_SMTP_FROM_NAME:-}
    volumes:
      - daypress-data:/data
    restart: unless-stopped

volumes:
  daypress-data:
