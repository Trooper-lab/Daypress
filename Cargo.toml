[workspace]
resolver = "2"
members = [
    "crates/daypress-server",
    "crates/daypress-transpiler",
    "crates/generated_slugify",
    "crates/daypress-ast",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Daypress Core Team"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/Trooper-lab/daypress"

[workspace.dependencies]
# Async Runtime & Web Framework
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["multipart"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = "0.5"

# Database & Storage
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Serialization & Formats
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
quick-xml = "0.37"

# Media & Image Processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

# Cryptography & Authentication
argon2 = "0.5"
getrandom = "0.2"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"

# Email (SMTP over rustls; no OpenSSL dependency)
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "hostname", "tokio1-rustls", "webpki-roots", "ring"] }

# CLI & Utilities
clap = { version = "4", features = ["derive", "env"] }
regex = "1.10"

# Error Handling & Observability
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# AI / Transpiler Pipeline
rig-core = { version = "0.45.0", features = ["rustls"] }

# Self-Updater (HTTP over rustls + archive decompression + SemVer)
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
flate2 = "1.1"
semver = "1.0"

# Password hashing (argon2id) is deliberately expensive; optimize it even in dev/test builds
# so logins and Basic-auth requests stay fast while developing and in CI.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

# Lighter debug info for dev and test builds: line numbers for the workspace crates (enough for
# backtraces), none for dependencies. Linking the many integration-test binaries then needs much
# less memory and disk.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
